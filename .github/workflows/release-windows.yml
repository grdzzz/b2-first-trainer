# Genera el instalador de Windows en un Windows real y lo publica en la rama `descargas`,
# de donde la app instalada descarga sus actualizaciones.
name: Publicar versión de Windows

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-windows
  cancel-in-progress: false

jobs:
  release:
    runs-on: windows-latest
    timeout-minutes: 40
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Instalar dependencias
        run: npm ci

      - name: Tests
        run: npm test

      - name: Compilar
        run: npm run build

      - name: Generar instalador
        run: npx electron-builder --win nsis --x64 --publish never

      - name: Subir el instalador a GitHub Releases
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION=$(node -p "require('./package.json').version")
          SETUP="dist/B2-First-Trainer-${VERSION}-setup.exe"
          gh release delete "v${VERSION}" --repo "$GITHUB_REPOSITORY" --yes --cleanup-tag 2>/dev/null || true
          gh release create "v${VERSION}" "$SETUP" --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" \
            --title "B2 First Trainer ${VERSION}" \
            --notes "Instalador para Windows. La app instalada se actualiza sola a esta versión."
          echo "RELEASE_DOWNLOAD_URL=https://github.com/${GITHUB_REPOSITORY}/releases/download/v${VERSION}" >> "$GITHUB_ENV"

      - name: Publicar latest.yml en la rama descargas
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          bash scripts/publish-descargas.sh
