# Genera el AppImage de Linux y lo adjunta a la release de la versión actual (v<versión>).
name: Publicar versión de Linux

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Instalar dependencias
        run: npm ci

      - name: Tests
        run: npm test

      - name: Generar AppImage
        run: npm run build:linux

      - name: Adjuntar a la release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION=$(node -p "require('./package.json').version")
          FILE="dist/B2-First-Trainer-${VERSION}-x86_64.AppImage"
          if ! gh release view "v${VERSION}" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release create "v${VERSION}" --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" \
              --title "B2 First Trainer ${VERSION}" --notes "Versiones para Windows y Linux."
          fi
          gh release upload "v${VERSION}" "$FILE" --repo "$GITHUB_REPOSITORY" --clobber
          echo "Subido: https://github.com/${GITHUB_REPOSITORY}/releases/download/v${VERSION}/$(basename "$FILE")"
